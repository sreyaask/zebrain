<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zebrain — The Complete Company Blueprint &amp; Operating Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Silkscreen&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#000; --panel:#0c0f17; --line:#1e2433; --mute:#8a93a8; --paper:#f4f6fb; --accent:#3d7bff;
  --text:#10131c; --soft:#5a6275; --rule:#dbe2f0; --tint:#eef3ff; --tint2:#f6f8fc;
  --v:#1f8a5b; --a:#b26a00; --r:#3d7bff; --i:#7a4fd6; --u:#c2413b;
}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;font:400 9.4pt/1.55 Inter,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:#fff;
  font-feature-settings:"tnum" 1,"cv11" 1;hyphens:auto}
@page{size:A4;margin:17mm 16mm 19mm 16mm;
  @bottom-left{content:"Zebrain · Company Blueprint & Operating Manual";font:500 7pt Inter,sans-serif;color:#8a93a8;letter-spacing:.04em}
  @bottom-right{content:counter(page);font:600 7.5pt "Geist Mono",monospace;color:#3d7bff}
}
@page dark{margin:0;@bottom-left{content:none}@bottom-right{content:none}@top-right{content:none}}
@page :first{margin:0;@bottom-left{content:none}@bottom-right{content:none}@top-right{content:none}}

/* Cover and dividers */
.cover,.divider{page:dark;break-before:page;break-after:page;height:297mm;width:210mm;background:#000;color:var(--paper);
  position:relative;overflow:hidden;padding:24mm 20mm}
.cover{break-before:auto}
.beam{position:absolute;left:-20%;right:-20%;height:120mm;bottom:-30mm;
  background:radial-gradient(60% 60% at 50% 100%,rgba(61,123,255,.85),rgba(61,123,255,.25) 45%,rgba(0,0,0,0) 72%)}
.beam.top{bottom:auto;top:-60mm;transform:rotate(180deg);opacity:.55}
.gridlines{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:10mm 10mm}
.pixel{font-family:Silkscreen,"Geist Mono",monospace;font-weight:400;letter-spacing:.02em}
.cover .wordmark{position:relative;font-size:46pt;line-height:1;margin:0}
.cover .kicker{position:relative;font:500 8pt "Geist Mono",monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 10mm}
.cover h1{position:relative;font:600 27pt/1.12 Inter,sans-serif;letter-spacing:-.02em;margin:16mm 0 6mm;max-width:150mm}
.cover .sub{position:relative;font-size:11pt;color:#b9c1d4;max-width:135mm;margin:0}
.cover .meta{position:absolute;left:20mm;right:20mm;bottom:22mm;display:flex;justify-content:space-between;
  font:500 7.5pt "Geist Mono",monospace;color:#b9c1d4;letter-spacing:.06em;text-transform:uppercase}
.cover .legend{position:relative;margin-top:16mm;display:flex;flex-wrap:wrap;gap:3mm}
.divider .num{position:relative;font-size:84pt;line-height:1;color:var(--accent);margin:40mm 0 0}
.divider h1{position:relative;font:600 30pt/1.1 Inter,sans-serif;letter-spacing:-.02em;margin:8mm 0 6mm;max-width:160mm}
.divider .lede{position:relative;font-size:11pt;color:#b9c1d4;max-width:140mm;margin:0}
.divider ul.in{position:relative;list-style:none;padding:0;margin:14mm 0 0;columns:2;column-gap:10mm;max-width:160mm}
.divider ul.in li{font:500 8.4pt "Geist Mono",monospace;color:#d7ddea;padding:2mm 0;border-top:1px solid rgba(255,255,255,.12);break-inside:avoid}
.marker{font-size:1pt;line-height:0;color:transparent;position:absolute}

/* Body typography */
h2{font:650 15pt/1.2 Inter,sans-serif;letter-spacing:-.015em;margin:9mm 0 3mm;break-after:avoid;break-inside:avoid;page-break-inside:avoid;color:#000;position:relative}
h2+*,h3+*{break-before:avoid}
h2 .n{font:500 9pt "Geist Mono",monospace;color:var(--accent);display:block;margin-bottom:1mm;letter-spacing:.06em}
h3{font:650 10.6pt/1.3 Inter,sans-serif;margin:5mm 0 1.6mm;break-after:avoid;color:#000}
h4{font:600 9pt/1.3 Inter,sans-serif;margin:3.5mm 0 1mm;break-after:avoid;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
p{margin:0 0 2.4mm;orphans:3;widows:3}
ul,ol{margin:0 0 2.6mm;padding-left:5mm}
li{margin:0 0 .9mm}
a{color:var(--accent);text-decoration:none}
strong{font-weight:600;color:#000}
.page{break-before:page}
.sec{break-before:page}
sup.c{font:600 6.4pt "Geist Mono",monospace;color:var(--accent);margin-left:.4mm}
.lead{font-size:10.6pt;line-height:1.55;color:#20242f}
.small{font-size:8.2pt;color:var(--soft)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
.cols:has(.checklist){break-inside:avoid}
#exec{font-size:8.7pt;line-height:1.48}#exec .lead{font-size:9.8pt}#exec h3{margin-top:3mm}#exec table{font-size:7.7pt;margin-bottom:2mm}#exec .kpi{margin:2mm 0}#exec li{margin-bottom:.5mm}#exec p{margin-bottom:1.8mm}
#final{break-before:page}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4.5mm}
.keep{break-inside:avoid}

/* Evidence tags */
.tag{display:inline-block;font:600 6.4pt/1 "Geist Mono",monospace;letter-spacing:.08em;text-transform:uppercase;
  padding:1.1mm 1.6mm .9mm;border-radius:99px;vertical-align:1px;white-space:nowrap;border:1px solid currentColor}
.tag.v{color:var(--v)}.tag.a{color:var(--a)}.tag.r{color:var(--r)}.tag.i{color:var(--i)}.tag.u{color:var(--u)}
.cover .tag{background:rgba(0,0,0,.4)}
.box{border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:2mm;padding:3mm 4mm;margin:3mm 0 4mm;
  background:var(--tint2);break-inside:avoid}
.box.v{border-left-color:var(--v)}.box.a{border-left-color:var(--a)}.box.i{border-left-color:var(--i)}.box.u{border-left-color:var(--u)}
.box>.tag{margin-bottom:1.6mm}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;margin:3mm 0 4mm}
.kpi div{border:1px solid var(--rule);border-radius:2mm;padding:3mm;break-inside:avoid}
.kpi b{display:block;font:600 15pt/1.1 Inter,sans-serif;color:#000;letter-spacing:-.01em}
.kpi span{font-size:7.6pt;color:var(--soft)}

/* Tables */
table{width:100%;border-collapse:collapse;margin:2mm 0 4mm;font-size:8.2pt;line-height:1.4}
thead{display:table-header-group}
table{break-inside:avoid}
tr{break-inside:avoid}
th{background:var(--tint);text-align:left;font-weight:600;color:#000;padding:1.6mm 2mm;border-bottom:1px solid #c6d3f2;vertical-align:bottom}
td{padding:1.5mm 2mm;border-bottom:1px solid var(--rule);vertical-align:top}
td.n,th.n{text-align:right;font-family:"Geist Mono",monospace;white-space:nowrap}
tr.tot td{font-weight:600;border-top:1.4px solid #000;color:#000}
caption{caption-side:top;text-align:left;font:600 7.4pt "Geist Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);padding-bottom:1.4mm}

/* Code */
pre{font:400 7.5pt/1.5 "Geist Mono",ui-monospace,Menlo,monospace;background:var(--panel);color:#e3e9f6;border-radius:2mm;
  padding:3mm 3.6mm;margin:2mm 0 4mm;white-space:pre-wrap;word-break:break-word;break-inside:avoid}
pre .k{color:#7fa8ff}pre .s{color:#9fe0b5}pre .c{color:#7d8699}
code{font:400 8pt "Geist Mono",monospace;background:var(--tint);padding:.2mm 1mm;border-radius:1mm}
.formula{font:500 8.6pt "Geist Mono",monospace;background:var(--tint2);border:1px dashed #c6d3f2;border-radius:2mm;padding:2.4mm 3mm;margin:2mm 0 3mm;break-inside:avoid}

/* Figures */
figure{margin:3mm 0 5mm;break-inside:avoid}
figure svg{width:100%;height:auto;display:block}
figcaption{font:500 7.4pt Inter,sans-serif;color:var(--soft);margin-top:1.6mm}
figcaption b{font-family:"Geist Mono",monospace;color:var(--accent);font-weight:500;margin-right:1.4mm}

/* TOC */
.toc h2{margin-top:0}
.toc ol{list-style:none;padding:0;margin:0}
.toc li.ch{display:flex;align-items:baseline;gap:3mm;padding:2.1mm 0;border-top:1px solid var(--rule);font-weight:600;font-size:10pt;color:#000;break-inside:avoid}
.toc li.sub{display:flex;align-items:baseline;gap:3mm;padding:.7mm 0 .7mm 11mm;font-size:8.4pt;color:var(--soft)}
.toc .no{font:500 8.4pt "Geist Mono",monospace;color:var(--accent);width:8mm;flex:none}
.toc .dots{flex:1;border-bottom:1px dotted #c3cad8;transform:translateY(-1mm)}
.toc .pg{font:500 8.4pt "Geist Mono",monospace;color:#000;min-width:7mm;text-align:right}
.checklist{list-style:none;padding:0}
.checklist li{padding-left:6mm;position:relative}
.checklist li:before{content:"";position:absolute;left:0;top:1mm;width:3mm;height:3mm;border:1.2px solid #8a93a8;border-radius:.6mm}
.tpl{border:1px solid #c6d3f2;border-radius:2mm;padding:3.5mm 4mm;margin:3mm 0 5mm;break-inside:avoid}
.tpl h3{margin-top:0}
.field{display:grid;grid-template-columns:38mm 1fr;border-bottom:1px solid var(--rule);padding:1.3mm 0;font-size:8.4pt}
.field b{font-weight:600;color:#000}
.field span{color:var(--soft)}
.bib li{font-size:8pt;margin-bottom:1.6mm;word-break:break-word}
</style>
</head>
<body>
